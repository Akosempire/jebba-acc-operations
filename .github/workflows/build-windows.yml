name: Build Jebba ACC Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Jebba-ACC-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $installer = ".\release\Jebba-ACC-Operations-Setup-$version.exe"
          gh release create "$env:GITHUB_REF_NAME" $installer --repo Akosempire/jebba-acc-operations --title "Jebba ACC Operations $env:GITHUB_REF_NAME" --notes "One-click per-user Windows installer. Follow your organisation's software approval policy."
        env:
          GH_TOKEN: ${{ github.token }}
